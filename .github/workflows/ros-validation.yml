name: ROS validation

on:
  pull_request:
  push:
    branches-ignore:
      - "praxis-inbox/**"

concurrency:
  group: ros-validation-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  debounce:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for commit batch
        run: sleep 600

  validate:
    needs: debounce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: ./ros registry check
      - run: ./ros validate
        env:
          ROS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
