name: ROS validation

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: ./ros registry check
      - run: ./ros validate
        env:
          ROS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
