name: Build and test

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore Aegis.sln
      - run: dotnet build Aegis.sln --no-restore --configuration Release
      - run: dotnet test Aegis.sln --no-build --configuration Release --verbosity normal
